<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>PRISM - Sign Up</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600&amp;display=swap" rel="stylesheet">
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-container": "#6df6d4",
                        "inverse-surface": "#303035",
                        "outline-variant": "#c7c5d2",
                        "tertiary-fixed": "#ffddb5",
                        "on-error": "#ffffff",
                        "error-container": "#ffdad6",
                        "primary": "#141558",
                        "surface-bright": "#fcf8ff",
                        "primary-container": "#2b2d6e",
                        "secondary-fixed-dim": "#4fdcbc",
                        "surface-container-low": "#f6f2f9",
                        "primary-fixed-dim": "#c0c1ff",
                        "secondary-fixed": "#70f9d7",
                        "on-primary-fixed-variant": "#3d4081",
                        "on-secondary-fixed": "#002019",
                        "inverse-on-surface": "#f3eff6",
                        "primary-fixed": "#e1e0ff",
                        "surface-container-highest": "#e4e1e8",
                        "inverse-primary": "#c0c1ff",
                        "background": "#fcf8ff",
                        "surface-container-high": "#eae7ed",
                        "on-tertiary-fixed": "#2a1800",
                        "surface-dim": "#dcd9df",
                        "on-primary-container": "#9597df",
                        "on-error-container": "#93000a",
                        "on-surface": "#1b1b20",
                        "error": "#ba1a1a",
                        "on-tertiary-container": "#d59024",
                        "on-tertiary-fixed-variant": "#643f00",
                        "on-secondary-container": "#00705c",
                        "on-secondary": "#ffffff",
                        "surface-tint": "#55589b",
                        "on-primary-fixed": "#101054",
                        "tertiary-fixed-dim": "#ffb958",
                        "tertiary-container": "#4c2f00",
                        "surface-variant": "#e4e1e8",
                        "surface-container": "#f0ecf3",
                        "surface": "#fcf8ff",
                        "on-surface-variant": "#464650",
                        "outline": "#777681",
                        "on-primary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "secondary": "#006b58",
                        "tertiary": "#301c00",
                        "on-secondary-fixed-variant": "#005142",
                        "on-background": "#1b1b20"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-padding-mobile": "20px",
                        "container-padding-desktop": "40px",
                        "gutter": "24px",
                        "section-gap": "64px",
                        "base": "8px"
                    },
                    "fontFamily": {
                        "display-lg": ["Plus Jakarta Sans"],
                        "body-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "body-md": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "600"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500"}],
                        "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "600"}]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-surface-container-low min-h-screen flex items-center justify-center p-container-padding-mobile md:p-container-padding-desktop antialiased text-on-surface">
<!-- Main Sign-up Card -->
<!-- Applying Level 1 Shadow: 4% opacity indigo shadow -> rgba(20,21,88,0.04) -->
<main class="w-full max-w-[420px] bg-surface-container-lowest rounded-[16px] shadow-[0_4px_20px_rgba(20,21,88,0.04)] px-6 py-10 md:px-10 md:py-12 flex flex-col gap-8 transition-all duration-300 ease-in-out hover:shadow-[0_8px_32px_rgba(20,21,88,0.06)]">
<!-- Header Section -->
<header class="flex flex-col gap-4">
<!-- Brand Mark -->
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">trip_origin</span>
<span class="font-display-lg text-body-md tracking-tight text-primary font-bold uppercase">Prism</span>
</div>
<!-- Headline -->
<h1 class="font-headline-md text-headline-md text-primary-container">
                Let's set you up
            </h1>
</header>
<!-- Form Section -->
<form class="flex flex-col gap-6" onsubmit="event.preventDefault();">
<!-- Inputs Group -->
<div class="flex flex-col gap-4">
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="email">Email or Phone</label>
<input class="w-full bg-transparent border border-outline-variant text-on-surface font-body-md text-body-md rounded-xl px-4 py-3 placeholder-outline transition-all duration-200 focus:border-primary focus:ring-2 focus:ring-primary/10 focus:outline-none" id="email" placeholder="you@example.com" type="text">
</div>
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="password">Password</label>
<div class="relative">
<input class="w-full bg-transparent border border-outline-variant text-on-surface font-body-md text-body-md rounded-xl px-4 py-3 placeholder-outline transition-all duration-200 focus:border-primary focus:ring-2 focus:ring-primary/10 focus:outline-none" id="password" placeholder="Create a strong password" type="password">
</div>
</div>
</div>
<!-- Consent Section -->
<div class="bg-surface-container rounded-xl p-5 flex items-start gap-4 transition-colors hover:bg-surface-variant/50">
<div class="flex items-center h-6 mt-0.5">
<input class="h-5 w-5 rounded-[4px] border-outline-variant text-primary focus:ring-primary/20 focus:ring-offset-0 bg-transparent transition-all cursor-pointer" id="consent" name="consent" type="checkbox">
</div>
<div class="flex flex-col gap-1">
<label class="font-body-md text-[14px] leading-[22px] text-on-surface-variant cursor-pointer select-none" for="consent">
                        PRISM does not store your original screenshots. We only keep anonymous metadata to help improve your experience.
                    </label>
</div>
</div>
<!-- Actions -->
<div class="flex flex-col gap-6 mt-2">
<!-- Using Secondary token to represent the Emerald request while staying within theme named colors -->
<button class="w-full bg-secondary text-on-secondary font-label-md text-[16px] leading-[24px] font-semibold py-3.5 px-6 rounded-xl transition-all duration-200 hover:bg-[#005142] active:scale-[0.98] shadow-sm flex items-center justify-center gap-2 group" type="submit">
                    Create Account
                    <span class="material-symbols-outlined text-[20px] transition-transform duration-200 group-hover:translate-x-1">arrow_forward</span>
</button>
<p class="text-center font-body-md text-label-md text-on-surface-variant">
                    Already have an account? 
                    <a class="text-primary font-medium hover:text-primary-container transition-colors underline-offset-4 hover:underline" href="#">Log in</a>
</p>
</div>
</form>
</main>
</body></html>
