<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>PRISM - Confirmation</title>
<!-- Fonts & Icons -->
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Config -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {},
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {},
                    fontFamily: {
                        "headline": ["Public Sans", "sans-serif"],
                        "display": ["Public Sans", "sans-serif"],
                        "body": ["Public Sans", "sans-serif"],
                        "label": ["Public Sans", "sans-serif"]
                    },
                    fontSize: {}
                }
            }
        }
    </script>
<style>
        body {
            background-color: #FAFAF9; /* off-white bg as requested */
            font-family: 'Public Sans', sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 md:p-8 antialiased selection:bg-indigo-100 selection:text-indigo-900">
<!-- Main Container -->
<main class="w-full max-w-[480px]">
<!-- PRISM Minimal Brand Mark -->
<div class="flex justify-center mb-8">
<h1 class="text-xl font-headline font-extrabold tracking-tight text-slate-800">
                PRISM
            </h1>
</div>
<!-- Confirmation Card -->
<div class="bg-white rounded-2xl shadow-[0px_8px_32px_rgba(0,0,0,0.04)] border border-slate-100 p-8 flex flex-col items-center text-center gap-8 transform transition-all duration-500 ease-out translate-y-0 opacity-100" id="confirmation-card">
<!-- Thumbnail Preview -->
<div class="w-28 h-28 rounded-xl overflow-hidden shadow-inner ring-1 ring-slate-100 flex-shrink-0 relative group">
<div class="absolute inset-0 bg-gradient-to-t from-black/20 to-transparent z-10"></div>
<img class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" data-alt="A serene landscape photograph featuring a calm, misty mountain range at dawn. Soft, ethereal light filters through the clouds, illuminating the gentle slopes in cool tones of pale blue, lavender, and muted sage green. The atmosphere is tranquil, quiet, and deeply peaceful, embodying a sense of safety and mindful reflection suitable for a guardian-themed editorial aesthetic. The composition is clean and minimalist." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCXxWgkM8G_josclmf7mwJOKFRogolaap_WrVzCM4-VQR53KD73sWKRHg9digoZhily45aSJ-ngy6rWSqDuv8eGs7H1qhmnkD9JYOKKDYTCp6pLhcdGR8kp4Q1XlIGWEbuCJO6399cbPbFr2rs47s860_ilfgPuurpzJUEBvjiB9z8vSGM5nkr5gFjJLOfGdwD-tU-NhTgCcW9KKL8pRbLIFr43gvLYYKsqjHq_OW9Ld9Eem9LCaOCx"/>
</div>
<!-- Context Badges -->
<div class="flex flex-wrap justify-center gap-3 w-full">
<span class="inline-flex items-center px-3.5 py-1.5 rounded-full border border-indigo-200 bg-indigo-50/50 text-indigo-700 text-sm font-medium gap-1.5 shadow-sm">
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
                    Private Chat
                </span>
<span class="inline-flex items-center px-3.5 py-1.5 rounded-full border border-slate-200 bg-slate-50/50 text-slate-600 text-sm font-medium gap-1.5 shadow-sm">
<span class="material-symbols-outlined text-[18px]">person</span>
                    From: Someone Else
                </span>
</div>
<!-- Personalized Text -->
<div class="space-y-3">
<p class="text-base font-body text-slate-600 leading-relaxed max-w-sm mx-auto">
                    We'll check this the way we'd check something forwarded to a private chat.
                </p>
</div>
<!-- Actions -->
<div class="flex justify-between items-center w-full mt-2 pt-6 border-t border-slate-100/80">
<button class="text-slate-500 font-medium hover:text-slate-800 transition-colors flex items-center px-2 py-2 rounded-lg hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-200">
                    Edit
                </button>
<button class="px-6 py-2.5 bg-emerald-500 hover:bg-emerald-600 text-white font-medium rounded-full shadow-[0_4px_14px_0_rgb(16,185,129,0.39)] hover:shadow-[0_6px_20px_rgba(16,185,129,0.23)] transition-all active:scale-95 flex items-center gap-2 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2">
                    Start Check
                    <span class="material-symbols-outlined text-[18px] font-bold" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
</div>
</div>
</main>
<script>
        // Subtle entrance animation for the card
        document.addEventListener("DOMContentLoaded", () => {
            const card = document.getElementById("confirmation-card");
            card.style.opacity = "0";
            card.style.transform = "translateY(16px)";
            
            requestAnimationFrame(() => {
                setTimeout(() => {
                    card.style.transition = "all 0.6s cubic-bezier(0.16, 1, 0.3, 1)";
                    card.style.opacity = "1";
                    card.style.transform = "translateY(0)";
                }, 100);
            });
        });
    </script>
</body></html>
