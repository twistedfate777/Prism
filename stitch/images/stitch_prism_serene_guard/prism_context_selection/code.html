<style>
        .material-symbols-outlined {
          font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Custom radio input styling hiding the actual radio */
        .destination-radio:checked + div {
            border-color: #2b2d6e; /* primary-container approx */
            box-shadow: 0 4px 20px 0 rgba(20, 21, 88, 0.08);
        }
        
        .destination-radio:checked + div .check-badge {
            opacity: 1;
            transform: scale(1);
        }
        
        .check-badge {
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.2s ease-in-out;
        }
    </style>

<body class="bg-background min-h-screen flex flex-col font-body-md text-on-background selection:bg-primary-fixed selection:text-primary">
<!-- Top Navigation (Contextual departure, hiding global nav shell, just a back button) -->
<header class="w-full px-container-padding-mobile md:px-container-padding-desktop py-6 max-w-[1200px] mx-auto flex items-center">
<a class="inline-flex items-center gap-2 text-primary/70 hover:text-primary transition-colors font-label-md text-label-md" href="#">
<span class="material-symbols-outlined text-[20px]" data-icon="arrow_back">arrow_back</span>
            Back
        </a>
</header>
<!-- Main Content Area -->
<main class="flex-grow flex flex-col items-center justify-center px-container-padding-mobile md:px-container-padding-desktop py-section-gap max-w-[800px] mx-auto w-full">
<!-- Header Section -->
<div class="text-center mb-12 max-w-[600px]">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary-container mb-4">
                Where are you sending this?
            </h1>
<p class="font-body-lg text-body-lg text-muted-charcoal">
                This helps us check what actually matters for this destination.
            </p>
</div>
<!-- Selection Grid -->
<form class="w-full" id="destinationForm">
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter mb-12">
<!-- Card 1: Social Media -->
<label class="relative cursor-pointer group">
<input class="destination-radio sr-only" name="destination" type="radio" value="social">
<div class="bg-white rounded-xl p-6 h-full border border-transparent shadow-level-1 transition-all duration-300 group-hover:shadow-level-2 group-hover:border-outline-variant/50 relative overflow-hidden flex flex-col items-center text-center gap-4">
<div class="w-12 h-12 rounded-full bg-surface-container-low flex items-center justify-center text-primary group-hover:bg-primary-fixed group-hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[24px]" data-icon="image">image</span>
</div>
<div>
<h3 class="font-label-md text-label-md text-on-surface mb-1">Social Media</h3>
<p class="font-label-sm text-label-sm text-outline font-normal">Public feeds, stories, posts</p>
</div>
<!-- Selected Badge -->
<div class="check-badge absolute top-4 right-4 w-6 h-6 rounded-full bg-emerald-check flex items-center justify-center text-white shadow-sm">
<span class="material-symbols-outlined text-[14px]" data-icon="check" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>
</label>
<!-- Card 2: Private Chat -->
<label class="relative cursor-pointer group">
<input class="destination-radio sr-only" name="destination" type="radio" value="chat">
<div class="bg-white rounded-xl p-6 h-full border border-transparent shadow-level-1 transition-all duration-300 group-hover:shadow-level-2 group-hover:border-outline-variant/50 relative overflow-hidden flex flex-col items-center text-center gap-4">
<div class="w-12 h-12 rounded-full bg-surface-container-low flex items-center justify-center text-primary group-hover:bg-primary-fixed group-hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[24px]" data-icon="chat_bubble">chat_bubble</span>
</div>
<div>
<h3 class="font-label-md text-label-md text-on-surface mb-1">Private Chat</h3>
<p class="font-label-sm text-label-sm text-outline font-normal">DMs, group chats, texts</p>
</div>
<!-- Selected Badge -->
<div class="check-badge absolute top-4 right-4 w-6 h-6 rounded-full bg-emerald-check flex items-center justify-center text-white shadow-sm">
<span class="material-symbols-outlined text-[14px]" data-icon="check" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>
</label>
<!-- Card 3: AI -->
<label class="relative cursor-pointer group">
<input class="destination-radio sr-only" name="destination" type="radio" value="ai">
<div class="bg-white rounded-xl p-6 h-full border border-transparent shadow-level-1 transition-all duration-300 group-hover:shadow-level-2 group-hover:border-outline-variant/50 relative overflow-hidden flex flex-col items-center text-center gap-4">
<div class="w-12 h-12 rounded-full bg-surface-container-low flex items-center justify-center text-primary group-hover:bg-primary-fixed group-hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[24px]" data-icon="auto_awesome">auto_awesome</span>
</div>
<div>
<h3 class="font-label-md text-label-md text-on-surface mb-1">AI Prompt</h3>
<p class="font-label-sm text-label-sm text-outline font-normal">ChatGPT, Claude, generators</p>
</div>
<!-- Selected Badge -->
<div class="check-badge absolute top-4 right-4 w-6 h-6 rounded-full bg-emerald-check flex items-center justify-center text-white shadow-sm">
<span class="material-symbols-outlined text-[14px]" data-icon="check" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>
</label>
<!-- Card 4: School/Work -->
<label class="relative cursor-pointer group">
<input class="destination-radio sr-only" name="destination" type="radio" value="school">
<div class="bg-white rounded-xl p-6 h-full border border-transparent shadow-level-1 transition-all duration-300 group-hover:shadow-level-2 group-hover:border-outline-variant/50 relative overflow-hidden flex flex-col items-center text-center gap-4">
<div class="w-12 h-12 rounded-full bg-surface-container-low flex items-center justify-center text-primary group-hover:bg-primary-fixed group-hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[24px]" data-icon="menu_book">menu_book</span>
</div>
<div>
<h3 class="font-label-md text-label-md text-on-surface mb-1">School / Work</h3>
<p class="font-label-sm text-label-sm text-outline font-normal">Assignments, professional emails</p>
</div>
<!-- Selected Badge -->
<div class="check-badge absolute top-4 right-4 w-6 h-6 rounded-full bg-emerald-check flex items-center justify-center text-white shadow-sm">
<span class="material-symbols-outlined text-[14px]" data-icon="check" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>
</label>
<!-- Card 5: Public / Other (Centered on odd rows in grid) -->
<label class="relative cursor-pointer group md:col-span-2 md:w-1/2 md:mx-auto">
<input class="destination-radio sr-only" name="destination" type="radio" value="public">
<div class="bg-white rounded-xl p-6 h-full border border-transparent shadow-level-1 transition-all duration-300 group-hover:shadow-level-2 group-hover:border-outline-variant/50 relative overflow-hidden flex flex-col items-center text-center gap-4">
<div class="w-12 h-12 rounded-full bg-surface-container-low flex items-center justify-center text-primary group-hover:bg-primary-fixed group-hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[24px]" data-icon="public">public</span>
</div>
<div>
<h3 class="font-label-md text-label-md text-on-surface mb-1">Public Forum</h3>
<p class="font-label-sm text-label-sm text-outline font-normal">Reddit, comments, blogs</p>
</div>
<!-- Selected Badge -->
<div class="check-badge absolute top-4 right-4 w-6 h-6 rounded-full bg-emerald-check flex items-center justify-center text-white shadow-sm">
<span class="material-symbols-outlined text-[14px]" data-icon="check" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>

</div>
<!-- Action Area -->
<div class="flex justify-center w-full">
<button class="bg-surface-variant text-outline-variant font-label-md text-label-md py-4 px-12 rounded-[12px] transition-all duration-300 cursor-not-allowed flex items-center gap-2" disabled="" id="submitBtn" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="verified_user">verified_user</span>
                    Check This
                </button>
</div>
</form>
</main>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('destinationForm');
            const submitBtn = document.getElementById('submitBtn');
            const radios = form.querySelectorAll('input[type="radio"]');

            // Handle enabling the button when a selection is made
            radios.forEach(radio => {
                radio.addEventListener('change', () => {
                    if (form.querySelector('input[type="radio"]:checked')) {
                        submitBtn.disabled = false;
                        submitBtn.classList.remove('bg-surface-variant', 'text-outline-variant', 'cursor-not-allowed');
                        // Emerald button style as requested
                        submitBtn.classList.add('bg-[#12B899]', 'text-white', 'hover:bg-[#0e967d]', 'shadow-level-1', 'cursor-pointer');
                    }
                });
            });
            
            // Dummy submit action
            submitBtn.addEventListener('click', (e) => {
                if(!submitBtn.disabled) {
                    submitBtn.innerHTML = `<span class="material-symbols-outlined animate-spin text-[20px]" data-icon="progress_activity">progress_activity</span> Analyzing...`;
                    submitBtn.classList.add('opacity-80');
                    setTimeout(() => {
                        submitBtn.innerHTML = `<span class="material-symbols-outlined text-[20px]" data-icon="check_circle">check_circle</span> Safe to Send`;
                        submitBtn.classList.remove('opacity-80');
                        submitBtn.classList.replace('bg-[#12B899]', 'bg-secondary');
                    }, 1500);
                }
            });
        });
    </script>
</body></html>
