<body class="min-h-screen flex flex-col font-body-md text-on-surface">
<!-- TopNavBar -->
<nav class="bg-surface dark:bg-inverse-surface w-full top-0 sticky bg-surface/80 backdrop-blur-md shadow-sm opacity-[1] shadow-[rgba(20,21,88,0.04)] transition-all duration-200 ease-in-out z-50">
<div class="flex justify-between items-center max-w-[1200px] mx-auto px-container-padding-desktop h-20">
<div class="font-display-lg text-headline-md tracking-tight text-primary dark:text-primary-fixed-dim">
                PRISM
            </div>
<div class="hidden md:flex gap-8">
<!-- Linear/Transactional Flow - Hiding global nav links to focus on the task -->
<a class="font-label-md text-label-md text-on-surface-variant dark:text-outline-variant hover:text-primary dark:hover:text-primary-fixed transition-colors duration-300" href="#">Platform</a>
<a class="font-label-md text-label-md text-on-surface-variant dark:text-outline-variant hover:text-primary dark:hover:text-primary-fixed transition-colors duration-300" href="#">Principles</a>
<a class="font-label-md text-label-md text-on-surface-variant dark:text-outline-variant hover:text-primary dark:hover:text-primary-fixed transition-colors duration-300" href="#">Safety</a>
<a class="font-label-md text-label-md text-on-surface-variant dark:text-outline-variant hover:text-primary dark:hover:text-primary-fixed transition-colors duration-300" href="#">Trust</a>
</div>
<div>
<button class="bg-primary text-on-primary font-label-md text-label-md px-6 py-3 rounded-button hover:bg-primary-fixed-variant transition-colors">

</div>

<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center py-section-gap px-container-padding-mobile md:px-container-padding-desktop">
<div class="w-full max-w-[560px] bg-white rounded-card shadow-level-1 p-gutter md:p-[48px]">
<h1 class="font-headline-md text-headline-md text-primary-container mb-gutter text-center">
                What are you about to share?
            </h1>
<!-- Upload Zone -->
<div class="border-2 border-dashed border-primary-fixed rounded-card p-gutter flex flex-col items-center justify-center mb-gutter transition-colors cursor-pointer group hover:bg-surface-container-low min-h-[240px]" id="upload-zone">
<span class="material-symbols-outlined text-4xl text-primary mb-4 group-hover:-translate-y-1 transition-transform" style="font-variation-settings: 'wght' 300, 'FILL' 0;">
                    upload_file
                </span>
<p class="font-body-md text-body-md text-on-surface mb-6 text-center">
                    Drop a screenshot, image, or paste text
                </p>
<button class="border border-primary text-primary font-label-md text-label-md px-6 py-3 rounded-button hover:bg-primary/5 transition-colors" onclick="document.getElementById('file-input').click()">
                    Browse files
                </button>
<input accept="image/*,text/*" class="hidden" id="file-input" type="file">
</div>
<!-- Textarea -->
<div class="mb-gutter relative">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-2" for="text-input">Or paste text directly</label>
<textarea class="w-full rounded-input border-[#E2E2E6] focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all font-body-md text-body-md text-on-surface bg-transparent resize-none p-4" id="text-input" placeholder="Enter content here..." rows="4"></textarea>
</div>
<!-- CTA -->
<button class="w-full bg-[#E2E2E6] text-outline-variant font-label-md text-label-md px-6 py-4 rounded-button transition-colors cursor-not-allowed flex items-center justify-center gap-2" id="continue-btn">
                Continue
                <span class="material-symbols-outlined text-lg" style="font-variation-settings: 'wght' 400, 'FILL' 0;">arrow_forward</span>
</button>
</div>
</main>
<!-- Footer -->
<footer class="bg-surface-container-low dark:bg-surface-container-tertiary w-full mt-section-gap transition-opacity duration-200">
<div class="flex flex-col md:flex-row justify-between items-center max-w-[1200px] mx-auto px-container-padding-desktop py-12">
<div class="font-display-lg text-headline-md text-primary dark:text-primary-fixed-dim mb-8 md:mb-0">
                PRISM
            </div>
<div class="flex flex-wrap justify-center gap-6 mb-8 md:mb-0">
<a class="font-body-md text-body-md text-on-surface-variant dark:text-outline-variant hover:text-primary dark:hover:text-secondary-fixed-dim transition-colors" href="#">Privacy Policy</a>
<a class="font-body-md text-body-md text-on-surface-variant dark:text-outline-variant hover:text-primary dark:hover:text-secondary-fixed-dim transition-colors" href="#">Terms of Service</a>
<a class="font-body-md text-body-md text-on-surface-variant dark:text-outline-variant hover:text-primary dark:hover:text-secondary-fixed-dim transition-colors" href="#">Security Disclosure</a>
<a class="font-body-md text-body-md text-on-surface-variant dark:text-outline-variant hover:text-primary dark:hover:text-secondary-fixed-dim transition-colors" href="#">Contact</a>
</div>
<div class="font-body-md text-body-md text-on-surface-variant dark:text-outline-variant text-center md:text-right">
                © 2024 PRISM. Mindful protection for every shared moment.
            </div>
</div>
</footer>
<script>
        // Simple Interaction Logic
        const uploadZone = document.getElementById('upload-zone');
        const fileInput = document.getElementById('file-input');
        const textInput = document.getElementById('text-input');
        const continueBtn = document.getElementById('continue-btn');
        
        let hasContent = false;

        function updateCTA() {
            if (hasContent) {
                // Enable CTA
                continueBtn.classList.remove('bg-[#E2E2E6]', 'text-outline-variant', 'cursor-not-allowed');
                continueBtn.classList.add('bg-[#12B899]', 'text-white', 'hover:bg-[#0e957c]');
                continueBtn.removeAttribute('disabled');
            } else {
                // Disable CTA
                continueBtn.classList.add('bg-[#E2E2E6]', 'text-outline-variant', 'cursor-not-allowed');
                continueBtn.classList.remove('bg-[#12B899]', 'text-white', 'hover:bg-[#0e957c]');
                continueBtn.setAttribute('disabled', 'true');
            }
        }

        // Text input listener
        textInput.addEventListener('input', (e) => {
            hasContent = e.target.value.trim().length > 0;
            updateCTA();
        });

        // File input listener
        fileInput.addEventListener('change', (e) => {
            if(e.target.files.length > 0) {
                hasContent = true;
                uploadZone.querySelector('p').textContent = e.target.files[0].name;
                updateCTA();
            }
        });

        // Drag and Drop
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            uploadZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            uploadZone.addEventListener(eventName, highlight, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            uploadZone.addEventListener(eventName, unhighlight, false);
        });

        function highlight(e) {
            uploadZone.classList.add('dragover');
        }

        function unhighlight(e) {
            uploadZone.classList.remove('dragover');
        }

        uploadZone.addEventListener('drop', handleDrop, false);

        function handleDrop(e) {
            let dt = e.dataTransfer;
            let files = dt.files;
            
            if(files.length > 0) {
                fileInput.files = files; // Assign to input
                hasContent = true;
                uploadZone.querySelector('p').textContent = files[0].name;
                updateCTA();
            }
        }
    </script>
</body></html>
